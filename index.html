    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('theme');
          if (s === 'dark' || s === 'light') t = s;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
